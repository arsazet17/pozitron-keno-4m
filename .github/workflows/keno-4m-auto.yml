name: KENO 4M · Stoloto AUTO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keno-4m-stoloto-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # Playwright-браузеры и системные зависимости уже внутри образа.
    # Это убирает самый долгий этап: playwright install --with-deps chromium.
    container:
      image: mcr.microsoft.com/playwright/python:v1.54.0-noble
      options: --ipc=host

    # Цель: обычный запуск 2–3 минуты.
    # 4 минуты — только аварийный потолок, чтобы не рубить нормальный запуск на 3:01.
    timeout-minutes: 4

    steps:
      - name: Кто запустил
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "RUN=$GITHUB_RUN_ID"

      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Взять самый свежий main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "WORKING_SHA=$(git rev-parse HEAD)"

      - name: Быстрые Python-зависимости
        run: |
          python --version
          pip install --disable-pip-version-check --no-input             "playwright==1.54.0"             "openpyxl==3.1.5"

      - name: Столото OAuth · последние 10 · 3 проверки · обновить KENO 4M
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: python scripts/keno_4m_stoloto_sync.py

      - name: Пересчитать временную статистику
        run: python scripts/build_time_stats.py

      - name: Сохранить безопасное обновление
        run: |
          if git diff --quiet -- data/archive.json data/keno_stolby_po_date_vremeni_16-08-2026.xlsx data/last_sync.json data/time_stats.json; then
            echo "Изменений нет"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/archive.json
          git add data/keno_stolby_po_date_vremeni_16-08-2026.xlsx
          git add data/last_sync.json
          git add data/time_stats.json

          git commit -m "KENO 4M · Столото автообновление"
          git push origin main
